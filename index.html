<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>치이카와 이상형 월드컵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#CFE9FA; --sky2:#FDE3EC; --surface:#FFFFFF; --ink:#4A4560; --soft:#8A84A3;
  --pink:#FF9DB8; --pink-soft:#FFE4EC; --butter:#FFE38F; --mint:#BDEBD6; --lilac:#DCD3FF;
  --line:#F1D9E2; --shadow:#F4C3D2;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky1:#23284A; --sky2:#3A2A45; --surface:#2F2F4A; --ink:#F4EEFF; --soft:#B9B2D4;
    --pink:#FF92B0; --pink-soft:#4A3350; --butter:#E9C96A; --mint:#4F7A6A; --lilac:#5A5087;
    --line:#4A4468; --shadow:#1A1830; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky1:#23284A; --sky2:#3A2A45; --surface:#2F2F4A; --ink:#F4EEFF; --soft:#B9B2D4;
  --pink:#FF92B0; --pink-soft:#4A3350; --butter:#E9C96A; --mint:#4F7A6A; --lilac:#5A5087;
  --line:#4A4468; --shadow:#1A1830; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:"Gaegu","Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif; font-size:1.18rem; line-height:1.5;
  background:var(--sky1);
  background-image:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,.55) 0 38px, transparent 39px),
    radial-gradient(circle at 16% 15%, rgba(255,255,255,.55) 0 28px, transparent 29px),
    radial-gradient(circle at 86% 9%, rgba(255,255,255,.5) 0 34px, transparent 35px),
    radial-gradient(circle at 90% 12%, rgba(255,255,255,.5) 0 26px, transparent 27px),
    linear-gradient(180deg,var(--sky1),var(--sky2));
  background-attachment:fixed;
}
.jua,h1,h2,h3{font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400}
.wrap{max-width:880px;margin:0 auto;padding:26px 16px 40px;position:relative}
.sparkle{position:absolute;pointer-events:none;font-size:1.3rem;opacity:.8}
header{text-align:center;margin-bottom:22px;position:relative}
.title-bubble{
  display:inline-block;background:var(--surface);padding:14px 28px 12px;border-radius:40px;
  box-shadow:0 6px 0 var(--shadow);position:relative;
}
.title-bubble::after{
  content:"";position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);
  border:12px solid transparent;border-top-color:var(--surface);border-bottom:0;
}
h1{font-size:clamp(1.8rem,6vw,2.7rem);margin:0;line-height:1.1;color:var(--pink);
   text-shadow:2px 2px 0 var(--butter)}
.sub{color:var(--soft);margin:20px 0 0;font-size:1.15rem}
.status{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.round{
  padding:5px 16px;border-radius:999px;background:var(--butter);color:#5a4a1e;
  font-family:"Jua",sans-serif;font-size:1.1rem;box-shadow:0 3px 0 #E8C35E;
}
.hearts{display:flex;gap:3px;font-size:.95rem}
.hearts span{opacity:.25;transition:opacity .3s, transform .3s}
.hearts span.on{opacity:1;transform:scale(1.1)}

.arena{display:grid;grid-template-columns:1fr 64px 1fr;gap:12px;align-items:stretch}
.vs{
  align-self:center;justify-self:center;width:60px;height:60px;border-radius:50%;
  background:var(--pink);color:#fff;font-family:"Jua",sans-serif;font-size:1.4rem;
  display:grid;place-items:center;box-shadow:0 4px 0 #E57A98;transform:rotate(-8deg);
}
.card{
  appearance:none;border:none;background:var(--surface);color:var(--ink);font:inherit;text-align:center;
  border-radius:34px;padding:20px 18px 18px;cursor:pointer;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  box-shadow:0 8px 0 var(--shadow);transition:transform .2s cubic-bezier(.3,1.6,.6,1), box-shadow .2s;
}
.card::before{ /* tape sticker */
  content:"";position:absolute;top:-10px;left:50%;width:70px;height:22px;transform:translateX(-50%) rotate(-3deg);
  background:var(--mint);opacity:.85;border-radius:4px;
}
.card:nth-of-type(3)::before{background:var(--lilac);transform:translateX(-50%) rotate(4deg)}
.card:hover{transform:translateY(-4px) rotate(-.6deg)}
.card:focus-visible{outline:4px dashed var(--pink);outline-offset:5px}
.card.picked{animation:boing .45s ease;box-shadow:0 8px 0 var(--pink)}
.card.lost{opacity:.3;transform:scale(.94) rotate(2deg)}
@keyframes boing{0%{transform:scale(1)}40%{transform:scale(1.08) rotate(-2deg)}70%{transform:scale(.98)}100%{transform:scale(1.04)}}

.badge{
  width:104px;height:104px;border-radius:50%;display:grid;place-items:center;margin-top:6px;
  font-size:3.2rem;position:relative;
  background:radial-gradient(circle at 35% 30%, #fff 0 18%, transparent 19%), var(--bgc,var(--pink-soft));
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.06), 0 0 0 6px var(--surface), 0 0 0 9px var(--ringc,var(--pink));
}
.badge img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.badge small{
  position:absolute;right:-6px;bottom:2px;font-size:1.3rem;transform:rotate(14deg);
}
.name{font-size:1.6rem;line-height:1.2;margin:8px 0 0;color:var(--pink);text-shadow:2px 2px 0 var(--butter)}
.tag{
  margin:0;font-size:1.02rem;color:var(--soft);background:var(--pink-soft);
  padding:1px 12px;border-radius:999px;
}
.box{width:100%;text-align:left;border-radius:20px;padding:10px 14px;margin:0;font-size:1.12rem}
.box b{font-family:"Jua",sans-serif;font-weight:400;font-size:1.02rem;margin-right:4px}
.good{background:color-mix(in srgb,var(--mint) 45%,transparent)}
.catch{background:var(--pink-soft);border:2px dashed var(--pink)}
.pick-hint{
  margin-top:4px;font-family:"Jua",sans-serif;background:var(--pink);color:#fff;
  padding:6px 20px;border-radius:999px;box-shadow:0 3px 0 #E57A98;font-size:1.05rem;
}

.result{text-align:center;max-width:520px;margin:0 auto}
.crown{font-size:3.2rem;line-height:1;animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(4deg)}}
.result h2{font-size:1.8rem;margin:4px 0 0;color:var(--pink);text-shadow:2px 2px 0 var(--butter)}
.result .card{cursor:default;margin:24px 0 18px}
.result .card:hover{transform:none}
.path{list-style:none;padding:0;margin:8px 0 22px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.path li{background:var(--surface);border-radius:999px;padding:3px 14px;box-shadow:0 3px 0 var(--shadow);font-size:1.08rem}
.btn{
  font-family:"Jua",sans-serif;font-size:1.2rem;border:none;background:var(--butter);color:#5a4a1e;
  border-radius:999px;padding:12px 30px;cursor:pointer;box-shadow:0 5px 0 #E8C35E;
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #E8C35E}
.btn:focus-visible{outline:4px dashed var(--pink);outline-offset:4px}
.confetti{position:fixed;top:-20px;pointer-events:none;font-size:1.3rem;animation:fall linear forwards;z-index:5}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.foot{text-align:center;color:var(--soft);font-size:1rem;margin-top:30px}

@media (max-width:640px){
  .arena{grid-template-columns:1fr;gap:6px}
  .vs{width:50px;height:50px;font-size:1.2rem;margin:4px 0}
  .badge{width:88px;height:88px;font-size:2.7rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <span class="sparkle" style="top:10px;left:6%">✨</span>
  <span class="sparkle" style="top:60px;right:5%">⭐</span>
  <span class="sparkle" style="top:120px;left:2%">🍙</span>
  <header>
    <div class="title-bubble"><h1>치이카와 이상형 월드컵</h1></div>
    <p class="sub">다 귀엽다고요? 설정을 읽으면 얘기가 달라져요.</p>
    <div class="status">
      <div class="round" id="round"></div>
      <div class="hearts" id="hearts" aria-hidden="true"></div>
    </div>
  </header>
  <main id="stage"></main>
  <p class="foot">팬이 만든 비공식 놀이 페이지예요 🌷 설정은 재미로 지어낸 거예요.</p>
</div>

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function start(){
  const all = shuffle(PEOPLE.map((p,i)=>({...p,id:i})));
  let k=1; while(k*2<=all.length) k*=2;
  const extra = all.length-k;
  if(extra>0){ current=all.slice(0,extra*2); byes=all.slice(extra*2); playIn=true; }
  else { current=all; byes=[]; playIn=false; }
  next=[]; idx=0; beaten={}; busy=false; played=0; render();
}

function inner(p){
  return `<span class="badge" style="--bgc:${p.bg};--ringc:${p.ring}" aria-hidden="true"><img src="${p.img}" alt=""></span>
    <h2 class="name">${p.n}</h2>
    <p class="tag">${p.t}</p>
    <p class="box good"><b>좋은 점</b>${p.g}</p>
    <p class="box catch"><b>근데…</b>${p.c}</p>`;
}

function render(){
  const total=current.length, m=idx/2+1;
  document.getElementById('round').textContent = playIn ? `예선 ${m}/${total/2}` : total===2 ? "두근두근 결승" : `${ROUND_NAMES[total]} ${m}/${total/2}`;
  const done = played;
  document.getElementById('hearts').innerHTML = Array.from({length:PEOPLE.length-1},(_,i)=>`<span class="${i<done?'on':''}">💗</span>`).join('');
  const a=current[idx], b=current[idx+1];
  const stage=document.getElementById('stage');
  stage.innerHTML = `<div class="arena">
    <button class="card" data-id="${a.id}">${inner(a)}<span class="pick-hint">이 친구로!</span></button>
    <div class="vs">VS</div>
    <button class="card" data-id="${b.id}">${inner(b)}<span class="pick-hint">이 친구로!</span></button>
  </div>`;
  stage.querySelectorAll('.card').forEach(el=>el.addEventListener('click',()=>choose(+el.dataset.id,el)));
}

function choose(id, el){
  if(busy) return; busy=true;
  const a=current[idx], b=current[idx+1];
  const win=a.id===id?a:b, lose=a.id===id?b:a;
  (beaten[win.id]=beaten[win.id]||[]).push(lose.n);
  document.querySelectorAll('.card').forEach(c=>c.classList.add(c===el?'picked':'lost'));
  setTimeout(()=>{
    busy=false; next.push(win); idx+=2; played++;
    if(idx>=current.length){
      if(playIn){ next=shuffle(next.concat(byes)); byes=[]; playIn=false; }
      if(next.length===1) return finish(next[0]);
      current=next; next=[]; idx=0;
    }
    render(); window.scrollTo({top:0,behavior:'smooth'});
  },520);
}

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const bits=["💗","⭐","🌸","✨","🍙","🎀"];
  for(let i=0;i<36;i++){
    const s=document.createElement('span'); s.className='confetti';
    s.textContent=bits[i%bits.length];
    s.style.left=Math.random()*100+'vw';
    s.style.animationDuration=(2.2+Math.random()*2)+'s';
    s.style.animationDelay=(Math.random()*.8)+'s';
    document.body.appendChild(s); setTimeout(()=>s.remove(),5200);
  }
}

function finish(w){
  document.getElementById('round').textContent="우승!";
  document.getElementById('hearts').innerHTML=Array.from({length:PEOPLE.length-1},()=>'<span class="on">💗</span>').join('');
  const list=(beaten[w.id]||[]).map(n=>`<li>${n}</li>`).join('');
  document.getElementById('stage').innerHTML=`
    <div class="result">
      <div class="crown" aria-hidden="true">👑</div>
      <h2>당신의 이상형은 ${w.n}!</h2>
      <p class="sub" style="margin-top:6px">“${w.c.split('.')[0]}.” 이것까지 감수하기로 했군요.</p>
      <div class="card" role="group" aria-label="${w.n}">${inner(w)}</div>
      <p class="jua" style="margin:0">우승까지 이긴 친구들</p>
      <ul class="path">${list}</ul>
      <button class="btn" id="again">한 번 더 하기 🔁</button>
    </div>`;
  document.getElementById('again').addEventListener('click',()=>{start();window.scrollTo({top:0});});
  confetti();
}

start();
</script>
</body>
</html>
